version: '3.8'

services:
  quantplus:
    image: quantplus/core:latest
    container_name: quantplus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 12GB
    environment:
      - TZ=America/New_York
      - MAX_WORKERS=3
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
