name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Triggers the workflow when you push to the main branch

env:
  PROJECT_ID: your-gcp-project-id            # Replace with your Google Cloud project ID
  REGION: us-central1                        # Replace with your Cloud Run region
  SERVICE: quantplus                         # The name of your Cloud Run service
  GAR_LOCATION: us-central1                  # Artifact Registry location
  GAR_REPO: your-artifact-repo-name          # Artifact Registry repository name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud
      # Note: Workload Identity Federation is recommended, but for simplicity 
      # here, we use a Service Account Key stored in GitHub Secrets.
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 3. Set up Docker to authenticate with Google Artifact Registry
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # 4. Build and Push the Docker image
      - name: Build and Push Container
        run: |-
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      # 5. Deploy the image to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
